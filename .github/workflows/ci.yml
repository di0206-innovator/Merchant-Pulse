name: MerchantPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint Check
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Evaluation Matrix
        run: npm run test:eval

      - name: Run Safety Benchmark
        run: npm run benchmark:safety

      - name: Run Batch Benchmark Smoke Test
        run: npm run benchmark:heldout

      - name: Build Next.js Application
        run: npm run build
